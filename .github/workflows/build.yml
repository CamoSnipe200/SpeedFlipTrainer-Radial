name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get BakkesMod SDK
        shell: pwsh
        run: |
          $bm = Join-Path $env:RUNNER_TEMP "bakkesmod"
          git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git (Join-Path $bm "bakkesmodsdk")
          "BAKKESMOD_PATH=$bm" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild SpeedFlipTrainer.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false "/p:BakkesModPath=$env:BAKKESMOD_PATH" /fl "/flp:logfile=build.log;verbosity=minimal"
          $code = $LASTEXITCODE
          # Surface errors as annotations so they can be read without the raw log
          Get-Content build.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 40 | ForEach-Object {
            $line = $_ -replace '%','%25' -replace "`r",'' -replace "`n",''
            Write-Output "::error::$line"
          }
          exit $code

      - name: Patch plugin for BakkesMod
        shell: pwsh
        continue-on-error: true
        run: |
          Copy-Item plugins/SpeedFlipTrainer.dll plugins/SpeedFlipTrainer.unpatched.dll
          $out = & "$env:BAKKESMOD_PATH\bakkesmodsdk\bakkesmod-patch.exe" "$PWD\plugins\SpeedFlipTrainer.dll" 2>&1 | Out-String
          $code = $LASTEXITCODE
          foreach ($l in ($out -split "`n" | Where-Object { $_.Trim() } | Select-Object -First 20)) { Write-Output "::warning::patch: $($l.Trim() -replace '%','%25')" }
          Write-Output "::warning::patch exit code $code"
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedFlipTrainer-dll
          path: plugins/*.dll
